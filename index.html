<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ilulu / イルル</title>

  <!-- ===== แก้ไขค่าด้านล่างนี้ตามบอทของคุณ ===== -->

  <!-- Open Graph: ทำให้เกิดการ์ดพรีวิวเวลาแชร์ลิงก์ -->
  <meta property="og:title" content="Ilulu / イルル">
  <meta property="og:description" content="ผู้เล่นไม่จำกัด">
  <meta property="og:image" content="https://i.imgur.com/2hK64c7.jpeg"> <!-- ใส่ URL รูปไอคอนบอทของคุณ -->
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="1200">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://namtxgamtx-arch.github.io/-discord-bot/">

  <!-- Discord จะอ่าน theme-color เป็นแถบสีด้านซ้ายของการ์ด (embed color) -->
  <meta name="theme-color" content="#2b6cb0">

  <!-- สำหรับ Twitter/X card (ถ้าต้องการ) -->
  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="Ilulu / イルル">
  <meta name="twitter:description" content="ผู้เล่นไม่จำกัด">
  <meta name="twitter:image" content="https://i.imgur.com/2hK64c7.jpeg
">

  <style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #1a1a2e;
      font-family: system-ui, -apple-system, sans-serif;
      color: #fff;
      text-align: center;
    }
    .box { padding: 24px; }
    a.manual-link {
      color: #7dabf8;
      text-decoration: none;
    }
  </style>

  <script>
    // ===== ใส่ลิงก์เชิญบอทจริงตรงนี้ (Discord OAuth invite URL) =====
    const inviteUrl = "https://discord.com/oauth2/authorize?client_id=1535336664535400538&permissions=8&integration_type=0&scope=bot+applications.commands";

    // หน่วงเล็กน้อยแล้ว redirect อัตโนมัติ
    setTimeout(function () {
      window.location.href = inviteUrl;
    }, 800);
  </script>
</head>
<body>
  <div class="box">
    <p>กำลังพาไปหน้าติดตั้งบอท...</p>
    <p>ถ้าไม่ได้ถูกพาไปอัตโนมัติ
      <a class="manual-link" id="manual-link" href="#">กดที่นี่</a>
    </p>
  </div>
  <script>
    document.getElementById("manual-link").href = inviteUrl;
  </script>
</body>
</html>
